<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b7cfa" />
  <title>Create Account — Kelvin Ikpeni Code Academy</title>
  <link rel="icon" type="image/svg+xml" href="/images/brand/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
</head>
<body data-page="register">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="auth-card container">
      <div class="card">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Start learning with Kelvin Ikpeni Code Academy.</p>
        <form class="form" id="registerForm" novalidate>
          <div class="field">
            <label for="fullName">Full name</label>
            <input class="input" id="fullName" name="fullName" type="text" autocomplete="name" required />
            <span class="field-error" data-error-for="name"></span>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required />
            <span class="field-error" data-error-for="email"></span>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            <span class="field-hint">At least 8 characters.</span>
            <span class="field-error" data-error-for="password"></span>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required />
            <span class="field-error" data-error-for="confirm"></span>
          </div>
          <label class="checkbox">
            <input type="checkbox" name="agree" required />
            I agree to the terms of service and privacy policy.
          </label>
          <span class="field-error" data-error-for="agree"></span>
          <button class="btn btn-primary btn-block" type="submit">Create Account</button>
        </form>
        <p class="auth-footer">
          Already have an account? <a href="/login.html">Sign in</a>
        </p>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
