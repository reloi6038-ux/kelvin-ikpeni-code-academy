<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b7cfa" />
  <title>Course Details — Kelvin Ikpeni Code Academy</title>
  <link rel="icon" type="image/svg+xml" href="/images/brand/favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/images/brand/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
</head>
<body data-page="courses">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="section container">
      <p style="margin-bottom:1rem;">
        <a href="/courses.html" style="color:var(--color-text-muted);">← Back to courses</a>
      </p>

      <div class="dashboard-grid">
        <!-- Dynamic Course Content goes here -->
        <div id="course-content">
          <p style="color:var(--color-text-muted)">Loading course…</p>
        </div>

        <!-- Enrolment Sidebar -->
        <aside class="sidebar-card">
          <h3>Enrol in this course</h3>
          <p class="card-text">Track progress and earn a certificate on completion.</p>
          <button class="btn btn-primary btn-block" id="enrol-btn" style="margin-top:1rem;">Enrol Now</button>
          
          <hr style="border:none;border-top:1px solid var(--color-border);margin:1.5rem 0;" />
          <ul style="list-style:none;padding:0;margin:0;display:grid;gap:0.75rem;font-size:0.9rem;color:var(--color-text-muted);">
            <li>💻 In-browser IDE</li>
            <li>🏅 Certificate on completion</li>
            <li>📱 Mobile-friendly learning</li>
          </ul>
        </aside>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/course-details.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
