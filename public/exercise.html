<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b7cfa" />
  <title>Exercise — Kelvin Ikpeni Code Academy</title>
  <link rel="icon" type="image/svg+xml" href="/images/brand/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/ide.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css" />
  <script src="/js/theme.js"></script>
</head>
<body data-page="practice">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="section container">
      <p style="margin-bottom:1rem;">
        <a href="/practice.html" style="color:var(--color-text-muted);">← Back to practice</a>
      </p>

      <!-- The main wrapper for the exercise -->
      <div id="exercise-mount">
        <div class="exercise-layout">
          <!-- Left Panel: Exercise Brief -->
          <aside class="card" id="exercise-brief">
            <p style="color:var(--color-text-muted)">Loading exercise…</p>
          </aside>

          <!-- Right Panel: IDE and Results -->
          <div>
            <div id="ide-mount"></div>
            <div id="results-mount"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- CodeMirror Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

  <!-- App Scripts -->
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ide.js"></script>
  <script src="/js/exercise.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
