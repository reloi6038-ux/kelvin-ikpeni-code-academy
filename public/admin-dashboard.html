<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b7cfa" />
  <title>Admin — Kelvin Ikpeni Code Academy</title>
  <link rel="icon" type="image/svg+xml" href="/images/brand/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script src="/js/theme.js"></script>
</head>
<body data-page="admin">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="section container">
      <header class="section-header">
        <p class="eyebrow">Admin</p>
        <h1>Administrator Dashboard</h1>
        <p>Manage users, courses, quizzes, certificates, and announcements.</p>
      </header>

      <div class="admin-tabs" id="admin-tabs">
        <button type="button" class="admin-tab active" data-tab="overview">Overview</button>
        <button type="button" class="admin-tab" data-tab="users">Users</button>
        <button type="button" class="admin-tab" data-tab="courses">Courses</button>
        <button type="button" class="admin-tab" data-tab="quizzes">Quizzes</button>
        <button type="button" class="admin-tab" data-tab="certificates">Certificates</button>
        <button type="button" class="admin-tab" data-tab="announcements">Announcements</button>
        <button type="button" class="admin-tab" data-tab="contacts">Messages</button>
      </div>

      <div class="admin-panel active" id="panel-overview">
        <div class="stat-grid" id="analytics-grid">
          <p style="color:var(--color-text-muted)">Loading analytics…</p>
        </div>
      </div>

      <div class="admin-panel" id="panel-users">
        <div class="admin-actions">
          <input class="input" id="user-search" placeholder="Search users by name or email…" style="max-width:300px;" />
        </div>
        <div id="users-table-wrap"><p style="color:var(--color-text-muted)">Loading users…</p></div>
      </div>

      <div class="admin-panel" id="panel-courses">
        <div class="admin-actions">
          <button class="btn btn-primary btn-sm" id="new-course-btn">+ New Course</button>
        </div>
        <div id="courses-table-wrap"><p style="color:var(--color-text-muted)">Loading courses…</p></div>
      </div>

      <div class="admin-panel" id="panel-quizzes">
        <div class="admin-actions">
          <button class="btn btn-primary btn-sm" id="new-quiz-btn">+ New Quiz</button>
        </div>
        <div id="quizzes-table-wrap"><p style="color:var(--color-text-muted)">Loading quizzes…</p></div>
      </div>

      <div class="admin-panel" id="panel-certificates">
        <div id="certs-table-wrap"><p style="color:var(--color-text-muted)">Loading certificates…</p></div>
      </div>

      <div class="admin-panel" id="panel-announcements">
        <div class="admin-actions">
          <button class="btn btn-primary btn-sm" id="new-announcement-btn">+ New Announcement</button>
        </div>
        <div id="announcements-wrap"><p style="color:var(--color-text-muted)">Loading announcements…</p></div>
      </div>

      <div class="admin-panel" id="panel-contacts">
        <div class="admin-actions">
          <h3 style="margin:0;">Contact Messages</h3>
        </div>
        <div id="contacts-table-wrap"><p style="color:var(--color-text-muted)">Loading messages…</p></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <div id="modal-root"></div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
