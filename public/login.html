<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b7cfa" />
  <title>Sign In — Kelvin Ikpeni Code Academy</title>
  <link rel="icon" type="image/svg+xml" href="/images/brand/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
</head>
<body data-page="login">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="auth-card container">
      <div class="card">
        <h1>Sign In</h1>
        <p class="auth-subtitle">Welcome back to Kelvin Ikpeni Code Academy.</p>
        <form class="form" id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required />
            <span class="field-error" data-error-for="email"></span>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
            <span class="field-error" data-error-for="password"></span>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Sign In</button>
        </form>
        <p class="auth-footer">
          Don't have an account? <a href="/register.html">Create one</a>
        </p>
        <p class="auth-footer">
          <a href="/forgot-password.html">Forgot password?</a>
        </p>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
