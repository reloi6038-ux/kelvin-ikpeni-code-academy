<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b7cfa" />
  <title>Playground — Kelvin Ikpeni Code Academy</title>
  <link rel="icon" type="image/svg+xml" href="/images/brand/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/ide.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css" />
  <script src="/js/theme.js"></script>
</head>
<body data-page="ide">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="section container">
      <header class="section-header">
        <p class="eyebrow">Playground</p>
        <h1>Code Playground</h1>
        <p>Write HTML, CSS, and JavaScript. See the result live.</p>
      </header>

      <div id="ide-playground"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ide.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      window.KICA.ide.create({
        containerId: "ide-playground",
        language: "html",
        starterHtml: "<body>\n  <h1>Hello, World!</h1>\n  <p>Try editing me.</p>\n</body>",
        starterCss: "body {\n  font-family: sans-serif;\n  padding: 2rem;\n}\n",
        starterJs: "console.log(\"Hello from the playground!\");\n"
      });
    });
  </script>
  <script src="/js/main.js"></script>
</body>
</html>
